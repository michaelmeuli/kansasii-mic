[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kansasii-mic"
version = "0.1.0"
description = "MIC outlier analysis for M. kansasii susceptibility testing data"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
files = ["src", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["adjustText"]
ignore_missing_imports = true
